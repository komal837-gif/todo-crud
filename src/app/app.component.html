
<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      form
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
         <ng-container *ngIf="todoArr.length > 0;else notodo">
            <ul class="list-group">
              <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let todo of todoArr; trackby:trackById">
                <strong>{{todo.todoItem}}</strong>
                <div>
                  <button mat-mini-fab color="primary"><mat-icon>edit</mat-icon></button>
                  <button mat-mini-fab color="warn"><mat-icon>delete</mat-icon></button>
                </div>
              </li>
           </ul>
         </ng-container>
         <ng-template #notodo>
          <p class="bg-dark text-white p-2">
            no todos..!!!
          </p>
         </ng-template>
        </div>
      </div>
  </div>
</div>
